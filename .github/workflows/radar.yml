name: radar

on:
  schedule:
    - cron: '*/5 * * * *' # GitHub sering telat 5–15 menit dari jadwal
  workflow_dispatch:

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      THREADS_COOKIES: ${{ secrets.THREADS_COOKIES }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache browser Playwright
        if: env.THREADS_COOKIES != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Pasang Chromium
        if: env.THREADS_COOKIES != ''
        run: npx playwright install --with-deps chromium

      - run: node src/index.js

      - name: Simpan state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || (git commit -q -m "update state [skip ci]" && git push -q)
